name: Municipal timetables check

# Weekly: did a municipality change the timetable we transcribed (data/municipal)? scripts/municipal-watch.ts
# compares each source with its stored hash. A change opens one issue for a person (or comments on the open one).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 08:00/09:00 Athens
  workflow_dispatch:

# One run at a time: two runs could both find no open issue and open two.
concurrency:
  group: municipal-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read # the previous run's misses artifact

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # A source that does not answer is reported only when the previous run missed it too (misses/unreachable.txt,
      # an artifact; a cache would expire after 7 idle days, the same as the schedule).
      - name: Previous run's unreachable sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p misses
          prev=$(gh run list --workflow municipal-watch.yml --status completed -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$prev" ]; then gh run download "$prev" -n municipal-misses -D misses || true; fi
          touch misses/unreachable.txt
      - run: bun scripts/municipal-watch.ts --misses misses/unreachable.txt > report.md
      - uses: actions/upload-artifact@v7
        with:
          name: municipal-misses
          path: misses/unreachable.txt
          retention-days: 30
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Δημοτικά: ίσως άλλαξε ένα ωράριο"
        run: |
          if [ ! -s report.md ]; then echo "no change"; exit 0; fi
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file report.md
          else gh issue create --title "$TITLE" --body-file report.md --label human --assignee angelospk; fi
