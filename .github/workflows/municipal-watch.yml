name: Municipal timetables check

# Weekly: did a municipality change the timetable we transcribed (data/municipal)? scripts/municipal-watch.ts
# compares each source with its stored hash. A change opens one issue for a person (or comments on the open one).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 08:00/09:00 Athens
  workflow_dispatch:

# One run at a time: two runs could both find no open issue and open two.
concurrency:
  group: municipal-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    # The site's own repository only: a copy has no one to assign and would open its own issues.
    if: github.repository == 'angelospk/athens-transit-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun from npm, not from GitHub's release downloads: those answered 504 for a while (2026-11-08) and failed the job.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g bun@1
      - run: bun install --frozen-lockfile
      - run: bun scripts/municipal-watch.ts > report.md
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Δημοτικά: ίσως άλλαξε ένα ωράριο"
        run: |
          if [ ! -s report.md ]; then echo "no change"; exit 0; fi
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file report.md
          else gh issue create --title "$TITLE" --body-file report.md --label human --assignee angelospk; fi
