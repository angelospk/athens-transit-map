name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE'] # the site does not use them
  workflow_dispatch:
  # The stats pages (/{city}/stats/, web#48) are built from the stats branch of athens-transit-rt,
  # which gets the new day between about 11:00 and 16:00 UTC (its cron runs late): rebuild after.
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 16 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let a started deploy finish; only queued runs are replaced

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun run build
        env:
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }} # the Apps Script of docs/feedback; unset = text-only form
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }} # Cloudflare Turnstile bot check; unset = no widget
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
