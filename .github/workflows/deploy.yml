name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE'] # the site does not use them
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let a started deploy finish; only queued runs are replaced

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun run build
        env:
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }} # the Apps Script of docs/feedback; unset = text-only form
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }} # Cloudflare Turnstile bot check; unset = no widget
          VITE_MAPKIT_TOKEN: ${{ secrets.VITE_MAPKIT_TOKEN }} # Apple Maps under ours in 2D (scripts/mapkit-token.mjs); unset = our own base map
          # The site's own repository builds for its domain's root; any other copy for <user>.github.io/<repo>/
          # (or the VITE_BASE repository variable, when set).
          VITE_BASE: ${{ vars.VITE_BASE || (github.repository != 'angelospk/athens-transit-map' && format('/{0}/', github.event.repository.name) || '') }}
      # A copy under a sub-path is not the site at staseis.gr: it must not claim that domain.
      - if: github.repository != 'angelospk/athens-transit-map'
        run: rm -f dist/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
