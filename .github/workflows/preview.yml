name: Preview on Cloudflare Pages

# Every branch but main gets its own preview: https://<branch>.athens-transit-map.pages.dev (the PR shows
# it as "View deployment"). Production stays on GitHub Pages (deploy.yml). Forks get no secrets: no preview.
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true # only the branch's last push matters

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun run build
        env:
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }} # the Apps Script of docs/feedback; unset = text-only form
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          out=$(bunx wrangler@4 pages deploy dist --project-name athens-transit-map --branch "$BRANCH" --commit-hash "$GITHUB_SHA" 2>&1 | tee /dev/stderr)
          url=$(printf '%s\n' "$out" | grep -o 'https://[^ ]*\.athens-transit-map\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
