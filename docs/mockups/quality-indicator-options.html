<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quality indicator options</title>
<style>
.app{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--border:#d2d2d7;--control:#f2f2f4;--land:#eceae4;--street:#fff;
  --ontime:#1a7f37;--late1:#a87c00;--late3:#c92a2a;--none:#8e8e93;--off:color-mix(in srgb,var(--muted) 30%,transparent)}
.app.dark{--bg:#111113;--fg:#f5f5f7;--muted:#a1a1a6;--border:#3a3a3c;--control:#2c2c2e;--land:#1f2023;--street:#34353a;
  --ontime:#30a14e;--late1:#d4a72c;--late3:#f05252;--none:#7c7c80}
*{box-sizing:border-box}body{margin:0}
.bar{display:flex;gap:6px;margin-bottom:12px;font-size:13px}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:10px;background:var(--secondary)}
.seg button{border:0;background:none;color:var(--foreground);font:inherit;font-size:13px;padding:5px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.app{border:1px solid var(--border);border-radius:16px;padding:14px;background:var(--bg);color:var(--fg);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h3{margin:0;font-size:15px}
.why{margin:3px 0 10px;font-size:12.5px;color:var(--muted);min-height:54px}
.tile{position:relative;height:96px;border-radius:10px;background:var(--land);overflow:hidden}
.tile svg.bg{position:absolute;inset:0;width:100%;height:100%}
.bus{position:absolute;top:30px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#0b5ed7;color:#fff;display:grid;place-items:center;
  box-shadow:0 1px 4px 1px rgba(0,0,0,.35)}
.bus>svg{width:16px;height:16px}
.bus .b{position:absolute;top:-8px;right:-12px}
.num{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font:700 10.5px/12px system-ui;color:var(--fg);
  text-shadow:0 0 2px var(--bg),0 0 2px var(--bg)}
.rows{margin:10px 0 0;padding:0;list-style:none}
.rows li{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);font-size:13.5px}
.rows li:last-child{border-bottom:0}
.rows .s{margin-left:auto;display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;white-space:nowrap}
.rows .s b{color:var(--lv);font-weight:600}
.pill{display:flex;align-items:center;gap:9px;margin-top:8px;padding:8px 11px;border-radius:10px;background:var(--control);font-size:13.5px;white-space:nowrap;overflow:hidden}
.pill .k{color:var(--muted)}.pill em{font-style:normal;font-weight:650;color:var(--lv)}
/* A: bars */
.ba{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.ba i{width:4px;border-radius:1px;background:var(--off)}.ba i:nth-child(1){height:5px}.ba i:nth-child(2){height:9px}.ba i:nth-child(3){height:14px}
.ba i.on{background:var(--lv)}
/* B: traffic light (row of 3, one lit, position = level) */
.tl{display:inline-flex;gap:2.5px;align-items:center;padding:2.5px 3.5px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--fg) 9%,transparent)}
.tl i{width:6px;height:6px;border-radius:50%;background:var(--off)}
.tl i.on{background:var(--lv);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lv) 30%,transparent)}
/* C: shape + mark */
.sh{flex:none;display:inline-grid;place-items:center;width:16px;height:16px}
.sh svg{width:16px;height:16px;display:block}
/* badge plate on the marker */
.plate{display:inline-flex;padding:2px 3px;border-radius:6px;background:var(--bg);box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 14%,transparent)}
</style></head><body>
<div class="bar"><span class="seg" id="theme"><button data-v="light" aria-pressed="true">Φωτεινό</button><button data-v="dark" aria-pressed="false">Σκοτεινό</button></span></div>
<div class="grid" id="g"></div>
<script>
const LVC={3:"var(--ontime)",2:"var(--late1)",1:"var(--late3)",0:"var(--none)"};
const BUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8.5 21v-3M15.5 21v-3"/></svg>';
const A=l=>`<span class="ba" style="--lv:${LVC[l]}">${[1,2,3].map(i=>`<i class="${l&&i<=l?"on":""}"></i>`).join("")}</span>`;
// B: left = normal, middle = worse, right = much worse
const B=l=>{const pos={3:1,2:2,1:3,0:0}[l];return`<span class="tl" style="--lv:${LVC[l]}">${[1,2,3].map(i=>`<i class="${i===pos?"on":""}"></i>`).join("")}</span>`};
const C=l=>{const c=LVC[l];const s={
 3:`<circle cx="8" cy="8" r="7.5" fill="${c}"/><path d="M4.6 8.2l2.3 2.3 4.5-4.7" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`,
 2:`<path d="M8 .9L15.4 14.6H.6Z" fill="${c}" stroke="${c}" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 5.6v4.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="8" cy="12.2" r="1.05" fill="#fff"/>`,
 1:`<path d="M4.9.6h6.2L15.4 4.9v6.2L11.1 15.4H4.9L.6 11.1V4.9Z" fill="${c}"/><path d="M8 4v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="11.7" r="1.15" fill="#fff"/>`,
 0:`<circle cx="8" cy="8" r="7" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="2.4 2"/>`}[l];
 return`<span class="sh"><svg viewBox="0 0 16 16" aria-hidden="true">${s}</svg></span>`};
const OPTS=[
 {f:A,t:"Α · Μπάρες (σήμερα)",w:"Ύψος = επίπεδο. Μοιάζει με ένδειξη σήματος κινητού: διαβάζεται και ως «πόσο σήμα/πόσο γεμάτο»."},
 {f:B,t:"Β · Φανάρι",w:"Τρεις θέσεις, ανάβει μία: αριστερά πράσινο, μέση κίτρινο, δεξιά κόκκινο. Η θέση λέει το επίπεδο και χωρίς χρώμα. Μεταφορά της κίνησης στον δρόμο."},
 {f:C,t:"Γ · Σχήμα με σημάδι",w:"Κύκλος με ✓, τρίγωνο με !, οκτάγωνο (σαν STOP) με !. Γκρι διακεκομμένος κύκλος = δεν ξέρουμε. Πιο σαφές, αλλά πιο έντονο / ανησυχητικό."}];
const ROWS=[[3,"Δημ. Θέατρο","κενό 6′"],[2,"Ταμπούρια","μαζί με άλλο"],[1,"Ταμπούρια","κενό 12′"],[0,"Σύνταγμα","—"]];
g.innerHTML=OPTS.map(o=>`<div class="app"><h3>${o.t}</h3><p class="why">${o.w}</p>
 <div class="tile"><svg class="bg" viewBox="0 0 300 96" preserveAspectRatio="none"><path d="M0 70L300 20" stroke="var(--street)" stroke-width="8"/><path d="M0 50L300 50" stroke="#0b5ed7" stroke-width="5" stroke-linecap="round"/></svg>
  ${[3,2,1,0].map((l,i)=>`<span class="bus" style="left:${12+i*24}%">${BUS}<span class="b plate">${o.f(l)}</span><span class="num">040</span></span>`).join("")}</div>
 <ul class="rows">${ROWS.map(([l,n,s])=>`<li><span>${n}</span><span class="s" style="--lv:${LVC[l]}">${l?`<b>${s}</b>`:s}${o.f(l)}</span></li>`).join("")}</ul>
 <div class="pill" style="--lv:${LVC[1]}">${o.f(1)}<span class="k">Χθες ·</span><span>αναμονή <em>~7′</em> <span class="k">(κανονικά ~4½′)</span></span></div>
</div>`).join("");
document.querySelectorAll("#theme button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#theme button").forEach(x=>x.setAttribute("aria-pressed",x===b));document.querySelectorAll(".app").forEach(e=>e.classList.toggle("dark",b.dataset.v==="dark"))});
</script></body></html>
